    <path d="M388 272 C 416 272, 412 450, 438 450"/>
    <path d="M388 407 C 416 407, 412 488, 438 488"/>
    <path d="M388 537 C 414 537, 414 540, 438 540"/>
    <path d="M388 684 C 416 684, 412 600, 438 600"/>
