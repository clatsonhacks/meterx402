    <path d="M1081 452 C 1106 452, 1100 272, 1128 272"/>
    <path d="M1081 470 C 1106 470, 1100 402, 1128 402"/>
    <path d="M1081 500 C 1106 500, 1100 548, 1128 548"/>
    <!-- graph service to the network -->
    <path d="M1341 625 V 642"/>
    <!-- gateway to its settlement adapter -->
    <path d="M760 645 V 662"/>
    <!-- adapter to the chains -->
    <path d="M760 763 V 790 H 500 V 820"/>
    <path d="M760 790 H 801 V 820"/>
    <path d="M801 790 H 1308 V 820"/>
  </g>
  <g stroke="#adb5bd" stroke-width="1.4" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)">
    <path d="M388 232 C 414 232, 414 240, 438 240"/>
  </g>
  <g font-size="12" fill="#868e96" font-style="italic">
    <text x="394" y="226">discover</text>
    <text x="392" y="378">call · 402 · pay</text>
    <text x="772" y="377">events, receipts</text>
    <text x="1086" y="340">metered call</text>
    <text x="772" y="784">verify and settle</text>
  </g>

  <!-- ═════ distribution ═════ -->
  <g font-size="12" font-weight="700" fill="#868e96" letter-spacing="1.5"><text x="48" y="1030">HOW PEOPLE GET IT</text></g>
  <g filter="url(#shadow)">
    <rect x="48" y="1044" width="490" height="78" rx="16" fill="#fff" stroke="#e3e5e8"/>
    <rect x="556" y="1044" width="490" height="78" rx="16" fill="#fff" stroke="#e3e5e8"/>
    <rect x="1064" y="1044" width="488" height="78" rx="16" fill="#fff" stroke="#e3e5e8"/>
  </g>
  <rect x="48" y="1044" width="5" height="78" rx="2.5" fill="#c92a2a"/>
  <rect x="556" y="1044" width="5" height="78" rx="2.5" fill="#0098ff"/>
  <rect x="1064" y="1044" width="5" height="78" rx="2.5" fill="#3b5bdb"/>
  <g font-size="13.5" fill="#495057">
    <text x="72" y="1074" font-size="16" font-weight="700" fill="#16161d">npm: mx402</text>
    <text x="72" y="1100"><tspan font-family="Consolas, monospace" fill="#7048e8">npx mx402</tspan>  sell · check · data · mcp · connector · analyst</text>
    <text x="580" y="1074" font-size="16" font-weight="700" fill="#16161d">Connect your AI guides</text>
    <text x="580" y="1100">Claude, ChatGPT, VS Code: step by step, own wallet</text>
    <text x="1088" y="1074" font-size="16" font-weight="700" fill="#16161d">MeterX402 VS Code extension</text>
    <text x="1088" y="1100">browse, call, publish; pays via your connector</text>
  </g>

  <text x="1552" y="1162" font-size="12.5" fill="#adb5bd" text-anchor="end">ETHOnline 2026 · github.com/clatsonhacks/meterx402 · testnets only</text>
