<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeterX402 · Pay per use, not per call</title>
<meta name="description" content="Usage-based x402 payments for APIs and AI agents: priced by what each call returns, settled on Hedera, Base or Solana, with live onchain data from The Graph and Uniswap.">
<meta property="og:title" content="MeterX402: pay per use, not per call">
<meta property="og:description" content="APIs and AI agents pay for exactly what each call returns, inside a budget, with a receipt anyone can verify on chain.">
<meta name="theme-color" content="#f5f4ee">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232a78d6' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='m12 13.8 4.2-4.2'/%3E%3Cpath d='M3.5 18.8a10 10 0 1 1 17 0'/%3E%3C/svg%3E">
<script>
  // Old links pointed at the app on "/": send them to /app with everything intact.
  // Then apply the stored theme before first paint (shared with the app).
  (function () {
    try {
      var s = new URLSearchParams(location.search), h = location.hash;
      var appKeys = ["open", "ask", "lane", "stream", "service", "integ", "rfq", "tab"];
      if (/^#(user|deployer)/.test(h) || appKeys.some(function (k) { return s.has(k); })) { location.replace("/app" + location.search + h); return; }
      var q = s.get("theme"), t = q || localStorage.getItem("mx402.theme");
      if (q === "system") localStorage.removeItem("mx402.theme"); else if (q) localStorage.setItem("mx402.theme", q);
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
